name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Verify tag and set release version
        id: metadata
        shell: pwsh
        run: |
          $version = (Select-String -Path src/termflow/version.py -Pattern '"([0-9]+\.[0-9]+\.[0-9]+)"').Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag/version mismatch" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "title=TermFlow $version" >> $env:GITHUB_OUTPUT
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: ruff check src tests
      - run: pytest -q
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean TermFlow.spec
          if (!(Test-Path dist/TermFlow.exe)) { throw "Missing executable" }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'TermFlow-smoke'
          $smoke = Start-Process -FilePath (Resolve-Path dist/TermFlow.exe) -ArgumentList '--check-prompts' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Packaged executable smoke test failed: $($smoke.ExitCode)" }
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (!$iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.metadata.outputs.version }}" installer/TermFlow.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          $file = "installer/output/TermFlow-Setup-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$file.sha256" -Value "$hash  TermFlow-Setup-x64.exe" -NoNewline
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.metadata.outputs.title }}
          generate_release_notes: true
          files: |
            installer/output/TermFlow-Setup-x64.exe
            installer/output/TermFlow-Setup-x64.exe.sha256
