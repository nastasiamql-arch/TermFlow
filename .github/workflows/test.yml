name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: ruff check src tests
      - run: pytest -q
      - name: Build and smoke-test executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean TermFlow.spec
          if (!(Test-Path dist/TermFlow.exe)) { throw "Missing executable" }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'TermFlow-prompt-smoke'
          $smoke = Start-Process -FilePath (Resolve-Path dist/TermFlow.exe) -ArgumentList '--check-prompts' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Prompt bundle smoke test failed: $($smoke.ExitCode)" }
          $uiSmoke = Start-Process -FilePath (Resolve-Path dist/TermFlow.exe) -ArgumentList '--smoke-ui' -Wait -PassThru
          if ($uiSmoke.ExitCode -ne 0) { throw "Packaged GUI startup smoke test failed: $($uiSmoke.ExitCode)" }
